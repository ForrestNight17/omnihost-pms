<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniHost PMS</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- Kenar çubuğu -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <a href="#/dashboard" class="brand-link" title="OmniHost PMS">
          <div class="brand-mark" aria-hidden="true">
            <img src="/img/omnihost-emblem-box.png" alt="OmniHost" class="brand-emblem-img" />
          </div>
          <div class="brand-text">
            <div class="brand-title">Omni<span class="brand-accent">Host</span></div>
            <div class="brand-subtitle">AI-POWERED PMS</div>
          </div>
        </a>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Menüyü Daralt / Genişlet (Ctrl+B)" aria-label="Menüyü Daralt / Genişlet">
          <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16">
            <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Ana menü"></nav>

      <div class="sidebar-foot">
        <button class="btn btn-gold btn-block btn-sm" data-global="sync-all" id="syncAllBtn">
          <span class="i-sync"></span> Tümünü Senkronize Et
        </button>
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">–</div>
          <div style="flex:1; min-width:0">
            <strong id="userName">—</strong>
            <span id="userRole">—</span>
          </div>
          <button class="icon-btn" id="logoutBtn" title="Çıkış Yap" aria-label="Çıkış" style="color:var(--gold-soft); font-size:1.2rem">⏻</button>
        </div>
      </div>
    </aside>

    <!-- Ana alan -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle-btn" id="menuToggle" title="Menüyü Aç / Kapat (Ctrl+B)" aria-label="Menü">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="topbar-title" id="pageTitle">Gösterge Paneli</div>
        <div class="topbar-right">
          <button class="theme-toggle" id="themeToggle" title="Açık / Koyu tema" aria-label="Tema değiştir">☾</button>
          <div class="today-chip" id="todayChip"></div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Katmanlar -->
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
